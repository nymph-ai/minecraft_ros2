Section "ServerLayout"
    Identifier     "HeadlessLayout"
    Screen      0  "DummyScreen" 0 0
EndSection

Section "Device"
    Identifier  "DummyDevice"
    Driver      "dummy"
    VideoRam    512000
    Option      "ConstantDPI" "true"
EndSection

Section "Monitor"
    Identifier  "DummyMonitor"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 1000.0
    Option      "DPMS" "false"
EndSection

Section "Screen"
    Identifier "DummyScreen"
    Device     "DummyDevice"
    Monitor    "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Extensions"
    Option "GLX" "Enable"
EndSection

Section "Module"
    Load "dri"
    Load "dri2"
    Load "glx"
EndSection

