Section "ServerLayout"
    Identifier     "HeadlessLayout"
    Screen      0  "Screen0" 0 0
EndSection

Section "Device"
    Identifier  "GPU0"
    Driver      "nvidia"
    Option      "AllowEmptyInitialConfiguration" "true"
    Option      "UseDisplayDevice" "DFP-0"
    Option      "ConnectedMonitor" "DFP-0"
EndSection

Section "Monitor"
    Identifier  "Monitor0"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 1000.0
    Option      "DPMS" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "GPU0"
    Monitor    "Monitor0"
    DefaultDepth 24
    Option     "MetaModes" "1920x1080"
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Extensions"
    Option "GLX" "Enable"
EndSection
