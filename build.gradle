plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.188'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Java 21をターゲットに設定
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        name = 'GeckoLib'
        url  = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = 'Baritone'
        url = 'https://jitpack.io'
    }
}

def ros2JavaPath = System.getenv("ROS2JAVA_INSTALL_PATH")

if (ros2JavaPath == null) {
    throw new GradleException("環境変数 ROS2JAVA_INSTALL_PATH が設定されていません。")
}

// パッケージ名一覧（必要なものをここに列挙）
def ros2Packages = [
    "rcljava",
    "rcljava_common"
]

def ros2Messages =[
    "geometry_msgs",
    "std_msgs",
    "builtin_interfaces",
    "sensor_msgs",
    "tf2_msgs",
    "simulation_interfaces",
    "minecraft_msgs"
]

// JARファイルパスを動的に収集
def ros2PackageJars = ros2Packages.collect { pkg ->
    file("${ros2JavaPath}/${pkg}/share/${pkg}/java/${pkg}.jar")
}

def ros2MessageJars = ros2Messages.collect { msg ->
    file("${ros2JavaPath}/${msg}/share/${msg}/java/${msg}_messages.jar")
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // ROS 2 Java dependencies
    ros2PackageJars.each { jar ->
        implementation files(jar)
    }

    ros2MessageJars.each { jar ->
        implementation files(jar)
    }

    // Compatibility settings
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') {
        version { strictly '5.0.4' }
    }

    // GeckoLib for NeoForge
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Baritone API for pathfinding and automation (from libs folder)
    // Loaded as a mod at runtime; compile-only to avoid classpath conflicts.
    // v1.15.0 verified with Minecraft 1.21.11 (NeoForge)
    compileOnly files('libs/baritone-api-neoforge-1.15.0.jar')
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neoforge_version        : neoforge_version,
            neoforge_version_range  : neoforge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

eclipse {
    synchronizationTasks 'genEclipseRuns'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
