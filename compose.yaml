services:
  minecraft:
    build:
      context: ..
      dockerfile: minecraft_ros2/Dockerfile
    image: minecraft-ros2/minecraft-ros2-local-build
    pull_policy: never
    command: ./runClient.sh
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - MINECRAFT_ROS2_ENABLE_BARITONE=true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./.cache/minecraft:/ws/minecraft_ros2/run
      - ./.cache/gradle:/root/.gradle
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all

  rviz:
    image: minecraft-ros2/minecraft-ros2-local-build
    pull_policy: never
    build:
      context: ..
      dockerfile: minecraft_ros2/Dockerfile
    command: ./runRviz.sh
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
